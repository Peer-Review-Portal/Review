<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Footy Hub | AFL Mini Games</title>
<style>
:root{--bg:#f2f6f1;--panel:#ffffff;--text:#10261c;--muted:#4b6357;--line:#cfdccf;--accent:#c27c15;--on-accent:#140d02;--field:#2f7d4f;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f17;--panel:#15301f;--text:#eaf4ea;--muted:#9db8a6;--line:#27472f;--field:#1f5d3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0d;--panel:#16161a;--text:#f1ede6;--muted:#a79f92;--line:#2c2a26;--field:#1f5d3a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#2a1b06 0%,transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:.04em}
.logo span{color:var(--accent)}
header .sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--accent)}
button.on,button.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
main{max-width:980px;margin:0 auto;padding:18px}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,#000),var(--panel));border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
.hero h1{margin:0 0 6px;font-size:1.6rem}
.hero p{margin:0;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar input{flex:1;min-width:160px;font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;text-align:left;display:block;width:100%}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ic{font-size:2rem}
.card h3{margin:6px 0 4px}
.card p{margin:0;color:var(--muted);font-size:.9rem}
.card .best{margin-top:8px;font-size:.8rem;color:var(--accent);font-weight:600}
#stage{display:none}
.stagebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;text-align:center}
canvas{width:100%;max-width:560px;border-radius:10px;border:1px solid var(--line);touch-action:none;background:var(--field)}
.hud{display:flex;justify-content:space-between;max-width:560px;margin:0 auto 8px;font-weight:600}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.q{font-size:1.1rem;margin:10px 0}
.opts{display:grid;gap:8px;max-width:420px;margin:0 auto}
.opts button.ok{background:#2e9b5a;color:#fff;border-color:#2e9b5a}
.opts button.bad{background:#c0392b;color:#fff;border-color:#c0392b}
#settings{display:none;margin-top:14px}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;margin-right:6px}
.tm{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:5px 10px}
#badge{display:inline-block;vertical-align:middle;line-height:0}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:24px 18px}
</style>
</head>
<body>
<header>
  <div class="logo"><span id="badge">🏉</span></div>
  <div class="sp"></div>
  <button id="home">Games</button>
  <button id="setBtn">Settings</button>
</header>
<main>
  <section id="settings" class="stagebox" style="text-align:left">
    <h3 style="margin-top:0">Settings</h3>
    <p class="hint" style="margin-top:0">Pick the team you support</p>
    <div id="teams"></div>
    <p class="hint">Or choose any accent colour</p>
    <div id="swatches"></div>
    <p class="hint">Theme</p>
    <button data-t="auto">Auto</button> <button data-t="light">Light</button> <button data-t="dark">Dark</button>
    <p class="hint"><button id="reset">Reset best scores</button></p>
  </section>

  <section id="lobby">
    <div class="hero">
      <h1 id="hh">Welcome to the Footy Hub</h1>
      <p>Original AFL mini games: kick for goal, take big marks and test your footy knowledge.</p>
    </div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search games…" aria-label="Search games">
      <button data-s="new" class="on">Newest</button>
      <button data-s="az">A–Z</button>
      <button data-s="za">Z–A</button>
      <button data-s="rnd">Random</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="stage">
    <button id="back">← Back to games</button>
    <div class="stagebox" id="play"></div>
  </section>
</main>
<footer>Footy Hub is an unofficial fan project and isn’t affiliated with the AFL or any club.</footer>

<script>
(function(){
var $=function(s,e){return (e||document).querySelector(s)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function best(id){return +(ls('fh_best_'+id)||0)}
function setBest(id,v){if(v>best(id))ls('fh_best_'+id,v)}
var cleanup=null;

/* ---------- Game 1: Goal Kicker ---------- */
function kicker(el){
  el.innerHTML='<div class="hud"><span id="ks">Score: 0</span><span id="kk">Kick 1/5</span></div><canvas width="560" height="340"></canvas><p class="hint" id="kh">Click / tap / Space to lock your aim.</p>';
  var c=$('canvas',el),x=c.getContext('2d'),W=560,H=340;
  var stage=0,t=0,aim=0,pw=0,kicks=0,score=0,msg='',ball=null,raf,last=performance.now(),done=false;
  function act(){
    if(done){kicks=0;score=0;done=false;stage=0;msg='';upd();return}
    if(stage===0){stage=1;$('#kh',el).textContent='Now lock your power (aim for the green band).'}
    else if(stage===1){
      var dx=aim*200,res;
      if(pw<.6)res=['Short! No score.',0];
      else if(Math.abs(dx)<36)res=['GOAL! 6 points',6];
      else if(Math.abs(dx)<100)res=['Behind. 1 point',1];
      else res=['Missed everything!',0];
      score+=res[1];msg=res[0];ball={p:0,tx:W/2+dx,ty:pw<.6?250:70};stage=2;kicks++;upd()
    }
  }
  function upd(){$('#ks',el).textContent='Score: '+score;$('#kk',el).textContent='Kick '+Math.min(kicks+1,5)+'/5'}
  function key(e){if(e.code==='Space'){e.preventDefault();act()}}
  c.addEventListener('pointerdown',act);document.addEventListener('keydown',key);
  function loop(n){
    var dt=(n-last)/1000;last=n;
    if(stage===0){t+=dt;aim=Math.sin(t*2.4)}
    if(stage===1){t+=dt;pw=(Math.sin(t*2.8)+1)/2}
    if(stage===2){ball.p+=dt*2;if(ball.p>=1){ball.p=1;if(kicks>=5){done=true;setBest('kick',score);$('#kh',el).textContent='Final: '+score+' points. Tap to play again.'}else{stage=0;$('#kh',el).textContent='Click / tap / Space to lock your aim.'}}}
    draw();raf=requestAnimationFrame(loop)
  }
  function draw(){
    x.fillStyle='#7fc4f0';x.fillRect(0,0,W,150);
    x.fillStyle='#2f7d4f';x.fillRect(0,150,W,H-150);
    x.strokeStyle='#fff';x.lineWidth=5;
    [-100,-36,36,100].forEach(function(o,i){var h=i%3===0?60:110;x.beginPath();x.moveTo(W/2+o,150);x.lineTo(W/2+o,150-h);x.stroke()});
    if(stage<2){x.fillStyle='rgba(255,255,255,.9)';x.fillRect(W/2+aim*200-3,40,6,110)}
    if(stage===1||stage===0){
      x.fillStyle='#222';x.fillRect(80,300,400,16);
      x.fillStyle='#2e9b5a';x.fillRect(80+400*.6,300,400*.4,16);
      x.fillStyle='#e0a800';x.fillRect(80+400*pw-3,296,6,24)
    }
    var bx=W/2,by=H-40;
    if(ball){bx=W/2+(ball.tx-W/2)*ball.p;by=H-40+(ball.ty-(H-40))*ball.p}
    x.fillStyle='#b5651d';x.beginPath();x.ellipse(bx,by,16-(ball?ball.p*8:0),10-(ball?ball.p*5:0),0,0,7);x.fill();
    if(msg&&stage===2){x.fillStyle='#fff';x.font='bold 26px system-ui';x.textAlign='center';x.fillText(msg,W/2,200)}
  }
  raf=requestAnimationFrame(loop);upd();
  return function(){cancelAnimationFrame(raf);document.removeEventListener('keydown',key)}
}

/* ---------- Game 2: Mark Taker ---------- */
function marker(el){
  el.innerHTML='<div class="hud"><span id="ms">Marks: 0</span><span id="ml">Lives: 3</span></div><canvas width="560" height="340"></canvas><p class="hint">Move your mouse / finger or use ← → to take the marks. Miss 3 and it’s over.</p>';
  var c=$('canvas',el),x=c.getContext('2d'),W=560,H=340;
  var px=W/2,balls=[],score=0,lives=3,spawn=0,over=false,raf,last=performance.now(),keys={};
  function move(e){var r=c.getBoundingClientRect();px=(e.clientX-r.left)*W/r.width}
  function kd(e){keys[e.key]=1;if(over&&(e.key===' '))reset()}
  function ku(e){keys[e.key]=0}
  function reset(){balls=[];score=0;lives=3;over=false;spawn=0;hud()}
  function hud(){$('#ms',el).textContent='Marks: '+score;$('#ml',el).textContent='Lives: '+lives}
  c.addEventListener('pointermove',move);c.addEventListener('pointerdown',function(e){if(over)reset();else move(e)});
  document.addEventListener('keydown',kd);document.addEventListener('keyup',ku);
  function loop(n){
    var dt=Math.min((n-last)/1000,.05);last=n;
    if(!over){
      if(keys.ArrowLeft)px-=380*dt;if(keys.ArrowRight)px+=380*dt;
      px=Math.max(24,Math.min(W-24,px));
      spawn-=dt;if(spawn<=0){balls.push({x:30+Math.random()*(W-60),y:-10,v:110+score*5});spawn=Math.max(.45,1.1-score*.02)}
      for(var i=balls.length-1;i>=0;i--){var b=balls[i];b.y+=b.v*dt;
        if(b.y>H-60&&b.y<H-20&&Math.abs(b.x-px)<34){balls.splice(i,1);score++;setBest('mark',score);hud()}
        else if(b.y>H){balls.splice(i,1);lives--;hud();if(lives<=0){over=true}}}
    }
    x.fillStyle='#2f7d4f';x.fillRect(0,0,W,H);
    x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=3;x.beginPath();x.ellipse(W/2,H,230,120,0,0,7);x.stroke();
    balls.forEach(function(b){x.fillStyle='#b5651d';x.beginPath();x.ellipse(b.x,b.y,10,15,.5,0,7);x.fill()});
    x.fillStyle='#e0a800';x.fillRect(px-22,H-48,44,34);
    x.fillStyle='#f2c9a0';x.beginPath();x.arc(px,H-56,10,0,7);x.fill();
    x.fillStyle='#fff';x.fillRect(px-26,H-62-2,0,0);
    if(over){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='bold 28px system-ui';x.textAlign='center';x.fillText('Full time! '+score+' marks',W/2,H/2-6);x.font='16px system-ui';x.fillText('Tap or press Space to play again',W/2,H/2+22)}
    raf=requestAnimationFrame(loop)
  }
  raf=requestAnimationFrame(loop);
  return function(){cancelAnimationFrame(raf);document.removeEventListener('keydown',kd);document.removeEventListener('keyup',ku)}
}

/* ---------- Game 3: Footy Quiz ---------- */
function quiz(el){
  var Q=[
   ['How many points is a goal worth?',['1','6','9','3'],1],
   ['How many points is a behind worth?',['1','2','6','0'],0],
   ['How many players does each team have on the field?',['15','11','18','22'],2],
   ['What is the shape of an AFL ground?',['Rectangle','Circle','Oval','Triangle'],2],
   ['How many quarters are in a match?',['2','3','4','6'],2],
   ['What is the name of the AFL’s best and fairest award?',['Brownlow Medal','Golden Boot','Heisman Trophy','Norm Smith'],0],
   ['A mark is awarded for catching a kick that travelled at least…',['5 metres','10 metres','15 metres','25 metres'],2],
   ['Which ground traditionally hosts the Grand Final?',['Adelaide Oval','The MCG','Optus Stadium','The Gabba'],1]
  ];
  var i=0,s=0;
  function show(){
    if(i>=Q.length){setBest('quiz',s);el.innerHTML='<h2>Final score: '+s+'/'+Q.length+'</h2><button class="pri" id="again">Play again</button>';$('#again',el).onclick=function(){i=0;s=0;show()};return}
    var q=Q[i];
    el.innerHTML='<div class="hud"><span>Question '+(i+1)+'/'+Q.length+'</span><span>Score: '+s+'</span></div><div class="q">'+q[0]+'</div><div class="opts"></div>';
    var box=$('.opts',el);
    q[1].forEach(function(o,k){var b=document.createElement('button');b.textContent=o;b.onclick=function(){
      var bs=box.children;for(var j=0;j<bs.length;j++){bs[j].disabled=true}
      if(k===q[2]){s++;b.className='ok'}else{b.className='bad';bs[q[2]].className='ok'}
      setTimeout(function(){i++;show()},900)};box.appendChild(b)});
  }
  show();return function(){}
}

var games=[
 {id:'kick',name:'Goal Kicker',ic:'🥅',desc:'Time your aim and power. Goals are 6, behinds are 1.',n:3,run:kicker,unit:'pts'},
 {id:'mark',name:'Mark Taker',ic:'🙌',desc:'Take the high ones before they hit the turf.',n:2,run:marker,unit:'marks'},
 {id:'quiz',name:'Footy Quiz',ic:'🧠',desc:'Eight quick questions on the rules of the game.',n:1,run:quiz,unit:'/8'}
];
var sort='new';
function render(){
  var q=$('#q').value.toLowerCase(),l=games.filter(function(g){return (g.name+g.desc).toLowerCase().indexOf(q)>-1});
  if(sort==='new')l.sort(function(a,b){return b.n-a.n});
  if(sort==='az')l.sort(function(a,b){return a.name.localeCompare(b.name)});
  if(sort==='za')l.sort(function(a,b){return b.name.localeCompare(a.name)});
  if(sort==='rnd')l.sort(function(){return Math.random()-.5});
  var g=$('#grid');g.innerHTML='';
  if(!l.length){g.innerHTML='<p class="hint">No games match that search.</p>';return}
  l.forEach(function(gm){var b=document.createElement('button');b.className='card';
    var bs=best(gm.id);
    b.innerHTML='<div class="ic">'+gm.ic+'</div><h3>'+gm.name+'</h3><p>'+gm.desc+'</p>'+(bs?'<div class="best">Best: '+bs+' '+gm.unit+'</div>':'');
    b.onclick=function(){openGame(gm)};g.appendChild(b)})
}
function openGame(gm){
  $('#lobby').style.display='none';$('#stage').style.display='block';
  if(cleanup)cleanup();cleanup=gm.run($('#play'))
}
function closeGame(){if(cleanup){cleanup();cleanup=null}$('#play').innerHTML='';$('#stage').style.display='none';$('#lobby').style.display='block';render()}
$('#back').onclick=closeGame;$('#home').onclick=closeGame;
$('#q').oninput=render;
document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){sort=b.dataset.s;document.querySelectorAll('[data-s]').forEach(function(o){o.classList.toggle('on',o===b)});render()}});

/* settings */
var cols=['#e0a800','#e4572e','#2e86de','#c0392b','#8e44ad','#16a085'],sw=$('#swatches');
cols.forEach(function(col){var b=document.createElement('button');b.className='sw';b.style.background=col;b.setAttribute('aria-label','Accent '+col);b.onclick=function(){setAccent(col);ls('fh_accent',col)};sw.appendChild(b)});
function setAccent(c){document.documentElement.style.setProperty('--accent',c)}
function setTheme(t){var r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}
document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){setTheme(b.dataset.t);ls('fh_theme',b.dataset.t)}});
$('#reset').onclick=function(){games.forEach(function(g){try{localStorage.removeItem('fh_best_'+g.id)}catch(e){}});render()};
$('#setBtn').onclick=function(){var s=$('#settings');s.style.display=s.style.display==='block'?'none':'block'};
var a=ls('fh_accent');if(a)setAccent(a);var th=ls('fh_theme');if(th)setTheme(th);
/* team picker */
var T=[['Adelaide Crows','ADE','#002b5c','#ffd200','#e21937'],['Brisbane Lions','BL','#7c003e','#fdbe57','#fdbe57'],['Carlton','CAR','#031a29','#ffffff','#5b8def'],['Collingwood','COL','#000000','#ffffff','#ffffff'],['Essendon','ESS','#000000','#e4002b','#e4002b'],['Fremantle','FRE','#2a0d54','#ffffff','#9b6df0'],['Geelong','GEE','#00164e','#ffffff','#5b8def'],['Gold Coast','GC','#d93f2a','#ffd100','#d93f2a'],['GWS Giants','GWS','#f47920','#2b2b2b','#f47920'],['Hawthorn','HAW','#4d2004','#fbbf15','#fbbf15'],['Melbourne','MEL','#0f1131','#ffffff','#de0316'],['North Melbourne','NM','#003f98','#ffffff','#2f6fd6'],['Port Adelaide','PA','#000000','#00a8cc','#00a8cc'],['Richmond','RIC','#fed102','#000000','#fed102'],['St Kilda','STK','#ed1b2f','#ffffff','#ed1b2f'],['Sydney','SYD','#ed171f','#ffffff','#ed171f'],['West Coast','WCE','#003087','#f2a900','#f2a900'],['Western Bulldogs','WB','#0039a6','#ffffff','#e4002b']];
